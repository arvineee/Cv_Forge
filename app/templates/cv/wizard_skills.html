{% extends "cv/_wizard_base.html" %}
{% block wizard_content %}
<h2 class="text-lg font-semibold text-gray-900 mb-1">Skills</h2>
<p class="text-sm text-gray-500 mb-6">Comma-separated. Not sure what to list? Let AI suggest a set based on your work experience so far.</p>

{% if ai_suggestion %}
<div class="mb-4 p-4 rounded-lg bg-indigo-50 border border-indigo-100">
  <p class="text-xs font-semibold text-indigo-700 mb-2">✨ AI suggestion</p>
  <p class="text-sm text-gray-800">{{ ai_suggestion }}</p>
</div>
{% endif %}

<form method="POST" action="{{ url_for('cv.wizard_step_save', resume_id=resume.id, step=step) }}" class="space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input name="content" placeholder="e.g. Python, Project Management, SQL, Stakeholder Communication"
         value="{{ draft or (resume.skills | join(', ') if resume.skills else '') }}"
         class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm">

  <div class="flex justify-between items-center pt-2">
    <button type="submit" name="action" value="enhance" formnovalidate
            class="px-4 py-2 rounded-lg border border-indigo-200 text-indigo-700 text-sm font-semibold hover:bg-indigo-50">
      ✨ Suggest skills with AI
    </button>
    <div class="flex gap-2">
      <a href="{{ url_for('cv.wizard_step', resume_id=resume.id, step=prev_step) }}"
         class="px-4 py-2 rounded-lg text-gray-500 text-sm font-medium hover:bg-gray-50">← Back</a>
      <button type="submit" name="action" value="next"
              class="px-5 py-2 rounded-lg gradient-brand text-white text-sm font-semibold">
        Continue →
      </button>
    </div>
  </div>
  <input type="hidden" name="draft" value="{{ resume.professional_summary or '' }}">
</form>
{% endblock %}
