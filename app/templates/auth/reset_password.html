{% extends "auth/_shell.html" %}
{% block title %}Reset Password | CVForge{% endblock %}
{% block auth_heading %}Choose a new password{% endblock %}
{% block auth_sub %}Pick something you haven't used elsewhere.{% endblock %}
{% block auth_form %}
<form method="POST" class="space-y-5" x-data="{ show: false }">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div>
    <label for="password" class="auth-label">New password</label>
    <div class="pw-wrap">
      <input id="password" :type="show ? 'text' : 'password'" type="password" name="password" required minlength="8" autofocus autocomplete="new-password" placeholder="At least 8 characters"/>
      <button type="button" class="pw-toggle" @click="show = !show" :aria-label="show ? 'Hide password' : 'Show password'"><svg x-show="!show" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg x-show="show" x-cloak class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 6.1A9.7 9.7 0 0112 6c6.5 0 10 6 10 6a17 17 0 01-3.2 3.9M6.7 7.7A16.7 16.7 0 002 12s3.5 6 10 6c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 004.2 4.2"/></svg></button>
    </div>
    <p class="auth-hint">Minimum 8 characters.</p>
  </div>
  <div>
    <label for="confirm_password" class="auth-label">Confirm new password</label>
    <input id="confirm_password" :type="show ? 'text' : 'password'" type="password" name="confirm_password" required minlength="8" autocomplete="new-password"/>
  </div>
  <button type="submit" class="btn btn-primary btn-lg w-full">Reset password</button>
</form>
{% endblock %}
