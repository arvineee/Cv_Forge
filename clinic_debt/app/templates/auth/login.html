<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In — MedDebt Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--teal:#00d4aa;--teal-dim:rgba(0,212,170,.12);--teal-glow:rgba(0,212,170,.25);
      --red:#ff4d6d;--red-dim:rgba(255,77,109,.12);--bg:#080c18;--surface:#0f1629;
      --card:#141c35;--border:#1e2a4a;--text:#e8edf8;--muted:#6b7da8}
    body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-wrap{width:100%;max-width:420px;padding:24px}
    .logo{text-align:center;margin-bottom:36px}
    .logo-icon{width:52px;height:52px;background:var(--teal);border-radius:14px;
      display:flex;align-items:center;justify-content:center;font-size:26px;
      margin:0 auto 12px;color:#080c18;font-weight:900}
    .logo h1{font-family:'DM Serif Display',serif;font-size:26px}
    .logo p{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:1px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px}
    h2{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:6px}
    .sub{font-size:13px;color:var(--muted);margin-bottom:24px}
    .form-group{margin-bottom:16px}
    label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;
      color:var(--muted);font-weight:600;margin-bottom:6px}
    .input{width:100%;background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:10px 14px;color:var(--text);font-size:13px;
      font-family:'Outfit',sans-serif;outline:none;transition:all .15s}
    .input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-glow)}
    .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:13px}
    .check-row{display:flex;align-items:center;gap:7px;color:var(--muted)}
    .btn{width:100%;padding:11px;background:var(--teal);color:#080c18;border:none;
      border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;
      font-family:'Outfit',sans-serif;transition:all .15s}
    .btn:hover{background:#00b890;transform:translateY(-1px);box-shadow:0 4px 16px var(--teal-glow)}
    .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;
      background:var(--red-dim);border:1px solid rgba(255,77,109,.25);color:var(--red);
      display:flex;align-items:center;gap:8px}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">
      <div class="logo-icon">✚</div>
      <h1>MedDebt</h1>
      <p>CLINIC DEBT TRACKER</p>
    </div>
    <div class="card">
      <h2>Sign In</h2>
      <p class="sub">Access your clinic debt records</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert">✕ {{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label>Email Address</label>
          <input class="input" type="email" name="email" placeholder="admin@clinic.ke" required autofocus>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="input" type="password" name="password" placeholder="••••••••" required>
        </div>
        <div class="row">
          <label class="check-row">
            <input type="checkbox" name="remember"> Remember me
          </label>
        </div>
        <button type="submit" class="btn">Sign In →</button>
      </form>
    </div>
  </div>
</body>
</html>
