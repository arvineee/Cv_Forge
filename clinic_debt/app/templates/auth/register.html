{% extends "base.html" %}
{% block title %}New User{% endblock %}
{% block page_title %}Create Staff Account{% endblock %}

{% block content %}
<div style="max-width:540px">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Account Details</span>
    </div>
    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input class="input" type="text" name="name" placeholder="Dr. Jane Doe" required>
        </div>
        <div class="form-group">
          <label>Role</label>
          <select class="select-field" name="role">
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Email Address</label>
          <input class="input" type="email" name="email" placeholder="staff@clinic.ke" required>
        </div>
        <div class="form-group full">
          <label>Password (min 6 characters)</label>
          <input class="input" type="password" name="password" placeholder="••••••••" required minlength="6">
        </div>
      </div>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
        <a href="{{ url_for('admin.users') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-primary">➕ Create Account</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
